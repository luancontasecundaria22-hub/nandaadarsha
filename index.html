<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nanda Adarsha — Yoga & Bem-Estar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dancing+Script:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #F0E6CC;
      --cream-dim: rgba(240, 230, 204, 0.88);
      --brown: #2E1A0E;
      --gold: #C9A96E;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a0f07;
      font-family: 'Inter', sans-serif;
    }

    /* ─── HERO ─── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* background photo */
    .hero__bg {
      position: absolute;
      inset: -30% 0;
      background-image: url('images/hero.png');
      background-size: cover;
      background-position: center 20%;
      filter: brightness(0.72) saturate(0.85);
      will-change: transform;
    }

    /* warm color grade overlay — mimics the poster's cinematic warmth */
    .hero__grade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(30,12,4,0.55) 0%, transparent 35%, transparent 55%, rgba(20,8,2,0.7) 100%),
        linear-gradient(to right, rgba(20,8,2,0.4) 0%, transparent 60%);
      mix-blend-mode: multiply;
    }

    /* warm amber tint */
    .hero__tint {
      position: absolute;
      inset: 0;
      background: rgba(160, 80, 20, 0.12);
      pointer-events: none;
    }

    /* ─── NAV ─── */
    .nav {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 48px;
    }

    .nav__tag {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: var(--cream);
      opacity: 0.75;
      text-transform: uppercase;
    }

    .nav__logo {
      font-family: 'Dancing Script', cursive;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .nav__logo span {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.7;
      display: block;
      text-align: right;
      margin-top: -2px;
    }

    /* ─── HEADLINE ─── */
    .hero__content {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 48px 0 52px;
      max-width: 820px;
    }

    .hero__headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(72px, 10vw, 148px);
      line-height: 0.92;
      letter-spacing: 0.01em;
      color: var(--cream);
      text-shadow: 0 4px 40px rgba(0,0,0,0.4);
      user-select: none;
    }

    .hero__headline .word {
      display: inline-block;
      cursor: default;
      transition: text-shadow 0.08s linear;
    }

    .hero__headline em {
      font-style: normal;
      color: var(--gold);
    }

    .hero__divider {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 28px 0 24px;
      opacity: 0.8;
    }

    .hero__sub {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.65;
      margin-bottom: 40px;
    }

    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: 1px solid rgba(240,230,204,0.5);
      color: var(--cream);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 28px;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
    }
    .hero__cta:hover {
      background: rgba(201,169,110,0.18);
      border-color: var(--gold);
    }
    .hero__cta::after {
      content: '→';
      font-size: 14px;
      transition: transform 0.3s;
    }
    .hero__cta:hover::after { transform: translateX(4px); }

    /* ─── BOTTOM BAR ─── */
    .hero__bottom {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 48px 36px;
    }

    .hero__script-block {
      line-height: 1;
    }
    .hero__script-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.55;
      display: block;
      margin-bottom: 4px;
    }
    .hero__script-name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(38px, 5vw, 68px);
      font-weight: 700;
      color: var(--cream);
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .hero__scroll {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--cream);
      opacity: 0.45;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }
    .hero__scroll-line {
      width: 1px;
      height: 40px;
      background: var(--cream);
      opacity: 0.4;
      animation: scrollLine 2s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%, 100% { transform: scaleY(1); opacity: 0.4; }
      50% { transform: scaleY(0.4); opacity: 0.1; }
    }

    /* ─── FADE IN ON LOAD ─── */
    .hero__content, .hero__bottom, .nav {
      opacity: 0;
      animation: fadeUp 1s ease forwards;
    }
    .nav { animation-delay: 0.2s; }
    .hero__content { animation-delay: 0.5s; }
    .hero__bottom { animation-delay: 0.8s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }


    /* ─── BELOW HERO PLACEHOLDER ─── */
    .coming-soon {
      background: #0e0704;
      color: var(--cream);
      text-align: center;
      padding: 120px 40px;
      opacity: 0.3;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero__bg" id="heroBg"></div>
    <div class="hero__grade"></div>
    <div class="hero__tint"></div>

    <!-- NAV -->
    <nav class="nav">
      <span class="nav__tag">#yoga</span>
      <a class="nav__logo" href="#">
        Nanda Adarsha
        <span>professora de yoga</span>
      </a>
    </nav>

    <!-- HEADLINE -->
    <div class="hero__content">
      <h1 class="hero__headline">
        <span class="word">FLUA</span><br>
        <span class="word">LIVREMENTE.</span><br>
        <span class="word">VIVA</span> <span class="word">COM</span><br>
        <em><span class="word">PRESENÇA.</span></em>
      </h1>
      <div class="hero__divider"></div>
      <p class="hero__sub">Yoga · Meditação · Bem-Estar</p>
      <a class="hero__cta" href="#">Comece sua jornada</a>
    </div>

    <!-- BOTTOM -->
    <div class="hero__bottom">
      <div class="hero__script-block">
        <span class="hero__script-label">com</span>
        <span class="hero__script-name">Nanda Adarsha</span>
      </div>
      <div class="hero__scroll">
        <div class="hero__scroll-line"></div>
        <span>rolar</span>
      </div>
    </div>
  </section>

  <div class="coming-soon">mais seções em breve</div>

  <script>
    /* ── Parallax ── */
    const bg   = document.getElementById('heroBg');
    const hero = document.querySelector('.hero');

    window.addEventListener('scroll', () => {
      const sy = window.scrollY;
      if (sy > hero.offsetHeight) return;
      bg.style.transform = `translateY(${sy * 0.4}px)`;
    }, { passive: true });

    /* ── Light-source text shadow ──
       Mouse position acts as a light — shadow projects away from it.
       Each .word gets a shadow offset calculated from its center to the cursor.
    */
    const words = document.querySelectorAll('.hero__headline .word');

    function updateShadows(mx, my) {
      words.forEach(word => {
        const r   = word.getBoundingClientRect();
        const wx  = r.left + r.width  / 2;
        const wy  = r.top  + r.height / 2;

        // vector from light (mouse) to word center
        const dx  = wx - mx;
        const dy  = wy - my;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // shadow length grows closer to the word, fades far away
        const MAX_DIST = 600;
        const strength = Math.max(0, 1 - dist / MAX_DIST);
        const len = strength * 14;

        // normalise direction
        const nx  = dist > 0 ? dx / dist : 0;
        const ny  = dist > 0 ? dy / dist : 0;

        const sx  = (nx * len).toFixed(1);
        const sy2 = (ny * len).toFixed(1);
        const blur = (8 + strength * 16).toFixed(1);
        const alpha = (0.25 + strength * 0.55).toFixed(2);

        const isGold = word.closest('em');
        const color  = isGold
          ? `rgba(120,60,10,${alpha})`
          : `rgba(0,0,0,${alpha})`;

        word.style.textShadow = `${sx}px ${sy2}px ${blur}px ${color}`;
      });
    }

    function clearShadows() {
      words.forEach(w => w.style.textShadow = '');
    }

    hero.addEventListener('mousemove', e => updateShadows(e.clientX, e.clientY));
    hero.addEventListener('mouseleave', clearShadows);
  </script>

</body>
</html>
