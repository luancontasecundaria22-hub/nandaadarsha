<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nanda Adarsha — Yoga & Bem-Estar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dancing+Script:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #F0E6CC;
      --cream-dim: rgba(240, 230, 204, 0.88);
      --brown: #2E1A0E;
      --gold: #C9A96E;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a0f07;
      font-family: 'Inter', sans-serif;
    }

    /* ─── HERO ─── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* background photo */
    .hero__bg {
      position: absolute;
      inset: -30% 0;
      background-image: url('https://images.unsplash.com/photo-1545389336-cf090694435e?w=1920&q=85&fit=crop&crop=center');
      background-size: cover;
      background-position: center 20%;
      filter: brightness(0.72) saturate(0.85);
      will-change: transform;
    }

    /* warm color grade overlay — mimics the poster's cinematic warmth */
    .hero__grade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(30,12,4,0.55) 0%, transparent 35%, transparent 55%, rgba(20,8,2,0.7) 100%),
        linear-gradient(to right, rgba(20,8,2,0.4) 0%, transparent 60%);
      mix-blend-mode: multiply;
    }

    /* warm amber tint */
    .hero__tint {
      position: absolute;
      inset: 0;
      background: rgba(160, 80, 20, 0.12);
      pointer-events: none;
    }

    /* ─── NAV ─── */
    .nav {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 48px;
    }

    .nav__tag {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: var(--cream);
      opacity: 0.75;
      text-transform: uppercase;
    }

    .nav__logo {
      font-family: 'Dancing Script', cursive;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .nav__logo span {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.7;
      display: block;
      text-align: right;
      margin-top: -2px;
    }

    /* ─── HEADLINE ─── */
    .hero__content {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 48px 0 52px;
      max-width: 820px;
    }

    .hero__headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(72px, 10vw, 148px);
      line-height: 0.92;
      letter-spacing: 0.01em;
      color: var(--cream);
      text-shadow: 0 4px 40px rgba(0,0,0,0.4);
      user-select: none;
    }

    .hero__headline em {
      font-style: normal;
      color: var(--gold);
    }

    .hero__divider {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 28px 0 24px;
      opacity: 0.8;
    }

    .hero__sub {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.65;
      margin-bottom: 40px;
    }

    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: 1px solid rgba(240,230,204,0.5);
      color: var(--cream);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 28px;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
    }
    .hero__cta:hover {
      background: rgba(201,169,110,0.18);
      border-color: var(--gold);
    }
    .hero__cta::after {
      content: '→';
      font-size: 14px;
      transition: transform 0.3s;
    }
    .hero__cta:hover::after { transform: translateX(4px); }

    /* ─── BOTTOM BAR ─── */
    .hero__bottom {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 48px 36px;
    }

    .hero__script-block {
      line-height: 1;
    }
    .hero__script-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.55;
      display: block;
      margin-bottom: 4px;
    }
    .hero__script-name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(38px, 5vw, 68px);
      font-weight: 700;
      color: var(--cream);
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .hero__scroll {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--cream);
      opacity: 0.45;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }
    .hero__scroll-line {
      width: 1px;
      height: 40px;
      background: var(--cream);
      opacity: 0.4;
      animation: scrollLine 2s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%, 100% { transform: scaleY(1); opacity: 0.4; }
      50% { transform: scaleY(0.4); opacity: 0.1; }
    }

    /* ─── FADE IN ON LOAD ─── */
    .hero__content, .hero__bottom, .nav {
      opacity: 0;
      animation: fadeUp 1s ease forwards;
    }
    .nav { animation-delay: 0.2s; }
    .hero__content { animation-delay: 0.5s; }
    .hero__bottom { animation-delay: 0.8s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── LIQUID GLASS ─── */
    .liquid-glass {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 4;
      transform: translate(-50%, -50%);
      transition: width 0.4s ease, height 0.4s ease, opacity 0.3s ease;
      opacity: 0;

      /* glass layers */
      background:
        radial-gradient(ellipse at 35% 35%, rgba(255,255,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 65%, rgba(201,169,110,0.08) 0%, transparent 55%);
      backdrop-filter: blur(6px) brightness(1.12) saturate(1.3);
      -webkit-backdrop-filter: blur(6px) brightness(1.12) saturate(1.3);

      /* refraction border */
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.35),
        inset 0 -1px 1px rgba(0,0,0,0.15),
        0 8px 40px rgba(0,0,0,0.25);

      /* SVG displacement filter applied below */
      filter: url(#glass-distort);
    }
    .liquid-glass.visible { opacity: 1; }

    /* inner specular highlight */
    .liquid-glass::before {
      content: '';
      position: absolute;
      top: 12%;
      left: 18%;
      width: 36%;
      height: 22%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.45) 0%, transparent 100%);
      filter: blur(6px);
    }
    /* subtle rim */
    .liquid-glass::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ─── BELOW HERO PLACEHOLDER ─── */
    .coming-soon {
      background: #0e0704;
      color: var(--cream);
      text-align: center;
      padding: 120px 40px;
      opacity: 0.3;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- SVG filter for glass refraction/distortion -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="glass-distort" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="linearRGB">
        <feTurbulence id="glassTurb" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="2" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
        <feComposite in="displaced" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
  </svg>

  <section class="hero">
    <div class="hero__bg" id="heroBg"></div>
    <div class="hero__grade"></div>
    <div class="hero__tint"></div>
    <!-- Liquid Glass orb -->
    <div class="liquid-glass" id="glassOrb"></div>

    <!-- NAV -->
    <nav class="nav">
      <span class="nav__tag">#yoga</span>
      <a class="nav__logo" href="#">
        Nanda Adarsha
        <span>professora de yoga</span>
      </a>
    </nav>

    <!-- HEADLINE -->
    <div class="hero__content">
      <h1 class="hero__headline">
        FLUA<br>
        LIVREMENTE.<br>
        VIVA COM<br>
        <em>PRESENÇA.</em>
      </h1>
      <div class="hero__divider"></div>
      <p class="hero__sub">Yoga · Meditação · Bem-Estar</p>
      <a class="hero__cta" href="#">Comece sua jornada</a>
    </div>

    <!-- BOTTOM -->
    <div class="hero__bottom">
      <div class="hero__script-block">
        <span class="hero__script-label">com</span>
        <span class="hero__script-name">Nanda Adarsha</span>
      </div>
      <div class="hero__scroll">
        <div class="hero__scroll-line"></div>
        <span>rolar</span>
      </div>
    </div>
  </section>

  <div class="coming-soon">mais seções em breve</div>

  <script>
    /* ── Parallax ── */
    const bg   = document.getElementById('heroBg');
    const hero = bg.closest('.hero');

    window.addEventListener('scroll', () => {
      const sy = window.scrollY;
      if (sy > hero.offsetHeight) return;
      bg.style.transform = `translateY(${sy * 0.4}px)`;
    }, { passive: true });

    /* ── Liquid Glass ── */
    const orb      = document.getElementById('glassOrb');
    const turbEl   = document.getElementById('glassTurb');

    let mx = 0, my = 0;       // target mouse
    let cx = 0, cy = 0;       // current (lerped)
    let size = 180;
    let seed = 2;
    let rafId;
    let inside = false;

    // smooth lerp factor
    const LERP = 0.095;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function animate() {
      cx = lerp(cx, mx, LERP);
      cy = lerp(cy, my, LERP);

      orb.style.left = cx + 'px';
      orb.style.top  = cy + 'px';

      // slowly drift the turbulence seed for a living-water feel
      seed += 0.003;
      turbEl.setAttribute('seed', seed);

      rafId = requestAnimationFrame(animate);
    }

    hero.addEventListener('mouseenter', (e) => {
      inside = true;
      mx = e.clientX; my = e.clientY;
      cx = mx; cy = my;
      orb.classList.add('visible');
      orb.style.width  = size + 'px';
      orb.style.height = size + 'px';
      if (!rafId) animate();
    });

    hero.addEventListener('mousemove', (e) => {
      mx = e.clientX;
      my = e.clientY;
    });

    hero.addEventListener('mouseleave', () => {
      inside = false;
      orb.classList.remove('visible');
      cancelAnimationFrame(rafId);
      rafId = null;
    });

    // grow on mousedown, shrink on mouseup — tactile feel
    hero.addEventListener('mousedown', () => {
      size = 240;
      orb.style.width  = size + 'px';
      orb.style.height = size + 'px';
      turbEl.setAttribute('baseFrequency', '0.022 0.028');
    });
    hero.addEventListener('mouseup', () => {
      size = 180;
      orb.style.width  = size + 'px';
      orb.style.height = size + 'px';
      turbEl.setAttribute('baseFrequency', '0.012 0.018');
    });
  </script>

</body>
</html>
